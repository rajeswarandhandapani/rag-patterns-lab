[project]
name = "rag-patterns-lab"
version = "0.1.0"
description = "Seven practical RAG pattern labs using LangChain, LangGraph, and Azure Foundry"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "chromadb>=1.0",
  "langchain>=1.0",
  "langchain-chroma>=1.0",
  "langchain-community>=0.4",
  "langchain-openai>=1.0",
  "langchain-text-splitters>=1.0",
  "langgraph>=1.0",
  "matplotlib>=3.10",
  "pydantic-settings>=2.10",
  "rank-bm25>=0.2.2",
  "typer>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-cov>=6.2", "ruff>=0.12"]
reranker = ["sentence-transformers>=5.0"]

[project.scripts]
rag-lab = "rag_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires Azure credentials and network access"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
